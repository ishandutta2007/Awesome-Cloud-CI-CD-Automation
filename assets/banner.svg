<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#030712"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="meshGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".3"/><stop offset="100%" stop-color="#0284c7" stop-opacity="0"/></linearGradient><linearGradient id="meshGrad2" x1="100%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#a855f7" stop-opacity=".25"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0"/></linearGradient><radialGradient id="glowPulse" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".25"/><stop offset="100%" stop-color="#0f172a" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".25" stroke-width=".8" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.15) translate(20px,-15px);opacity:.65}}@keyframes pulseOrb2{0%{transform:scale(1.1) translate(0,0);opacity:.3}50%{transform:scale(.9) translate(-25px,20px);opacity:.6}}@keyframes flowLine{0%{stroke-dashoffset:400}}@keyframes floatPill{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes nodePing{0%{r:5px;opacity:.6}50%{r:8px;opacity:1}}.bg{fill:url(#bgGrad)}.grid-bg{fill:url(#grid)}.orb-1{animation:pulseOrb 8s ease-in-out infinite;transform-origin:250px 150px}.orb-2{animation:pulseOrb2 10s ease-in-out infinite;transform-origin:950px 260px}.pipeline-wire{stroke-dasharray:12,12;animation:flowLine 20s linear infinite}.pill-animated-1{animation:floatPill 5s ease-in-out infinite}.pill-animated-2{animation:floatPill 6s ease-in-out infinite 1s}.pill-animated-3{animation:floatPill 5.5s ease-in-out infinite 2s}.pill-animated-4{animation:floatPill 6.5s ease-in-out infinite .5s}.node-pulse{animation:nodePing 3s ease-in-out infinite}</style><rect width="1200" height="420" class="bg"/><circle cx="240" cy="140" r="180" fill="url(#meshGrad1)" class="orb-1" filter="url(#glow)"/><circle cx="960" cy="280" r="220" fill="url(#meshGrad2)" class="orb-2" filter="url(#glow)"/><circle cx="600" cy="200" r="300" fill="url(#glowPulse)"/><rect width="1200" height="420" class="grid-bg"/><g opacity=".35"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 50 120 C 300 60, 450 180, 750 100 C 950 40, 1050 140, 1150 110" class="pipeline-wire"/><path fill="none" stroke="#818cf8" stroke-width="2" d="M 50 310 C 250 360, 500 240, 800 320 C 1000 380, 1100 280, 1150 300" class="pipeline-wire" style="animation-direction:reverse"/><circle cx="250" cy="130" r="6" fill="#38bdf8" class="node-pulse"/><circle cx="600" cy="118" r="5" fill="#818cf8"/><circle cx="890" cy="90" r="6" fill="#c084fc" class="node-pulse"/><circle cx="310" cy="335" r="5" fill="#38bdf8"/><circle cx="680" cy="280" r="6" fill="#818cf8" class="node-pulse"/><circle cx="1020" cy="330" r="5" fill="#c084fc"/></g><g text-anchor="middle"><g transform="translate(600, 125) translate(0, -60)"><rect width="370" height="32" x="-185" y="-16" fill="#1e293b" fill-opacity=".85" stroke="#38bdf8" stroke-width="1.2" rx="16"/><circle cx="-160" cy="0" r="4" fill="#38bdf8" class="node-pulse"/><text x="-145" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spac
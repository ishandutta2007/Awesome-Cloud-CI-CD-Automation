<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="meshGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="meshGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="glowPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.25" />
    </pattern>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .grid-bg { fill: url(#grid); }
    
    /* Animation Keyframes */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.65; }
    }
    
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1.1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(0.9) translate(-25px, 20px); opacity: 0.6; }
    }

    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    @keyframes nodePing {
      0%, 100% { r: 5px; opacity: 0.6; }
      50% { r: 8px; opacity: 1; }
    }

    .orb-1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 250px 150px;
    }

    .orb-2 {
      animation: pulseOrb2 10s ease-in-out infinite;
      transform-origin: 950px 260px;
    }

    .pipeline-wire {
      stroke-dasharray: 12, 12;
      animation: flowLine 20s linear infinite;
    }

    .pill-animated-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-animated-2 { animation: floatPill 6s ease-in-out infinite 1s; }
    .pill-animated-3 { animation: floatPill 5.5s ease-in-out infinite 2s; }
    .pill-animated-4 { animation: floatPill 6.5s ease-in-out infinite 0.5s; }

    .node-pulse { animation: nodePing 3s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" class="bg" />

  <!-- Animated Glowing Orbs (Deep Background) -->
  <circle cx="240" cy="140" r="180" fill="url(#meshGrad1)" class="orb-1" filter="url(#glow)" />
  <circle cx="960" cy="280" r="220" fill="url(#meshGrad2)" class="orb-2" filter="url(#glow)" />
  <circle cx="600" cy="200" r="300" fill="url(#glowPulse)" />

  <!-- Subtle Matrix Grid -->
  <rect width="1200" height="420" class="grid-bg" />

  <!-- Dynamic CI/CD Pipeline Streams (Background Layer) -->
  <g opacity="0.35">
    <path class="pipeline-wire" d="M 50 120 C 300 60, 450 180, 750 100 C 950 40, 1050 140, 1150 110" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="pipeline-wire" d="M 50 310 C 250 360, 500 240, 800 320 C 1000 380, 1100 280, 1150 300" fill="none" stroke="#818cf8" stroke-width="2" style="animation-direction: reverse;" />
    
    <!-- Dynamic Stage Nodes -->
    <circle cx="250" cy="130" r="6" fill="#38bdf8" class="node-pulse" />
    <circle cx="600" cy="118" r="5" fill="#818cf8" />
    <circle cx="890" cy="90" r="6" fill="#c084fc" class="node-pulse" />
    
    <circle cx="310" cy="335" r="5" fill="#38bdf8" />
    <circle cx="680" cy="280" r="6" fill="#818cf8" class="node-pulse" />
    <circle cx="1020" cy="330" r="5" fill="#c084fc" />
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed High Contrast & Clarity -->
  <g transform="translate(600, 125)" text-anchor="middle">
    <!-- Top Pill Badge -->
    <g transform="translate(0, -60)">
      <rect x="-185" y="-16" width="370" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="-160" cy="0" r="4" fill="#38bdf8" class="node-pulse" />
      <text x="-145" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">CURATED CLOUD AUTOMATION ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="#f8fafc" letter-spacing="-1">
      Awesome Cloud CI/CD Automation
    </text>

    <!-- Subtitle / Tagline -->
    <text y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#94a3b8" letter-spacing="0.3">
      The definitive directory of SaaS platforms, self-hosted runners, GitOps continuous delivery &amp; programmable pipelines.
    </text>
  </g>

  <!-- Interactive / Floating Feature Pills (Foreground Bottom) -->
  <g transform="translate(600, 290)">
    <!-- Pill 1: GitOps Delivery -->
    <g class="pill-animated-1" transform="translate(-460, 0)">
      <rect x="0" y="0" width="205" height="42" rx="21" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
      <text x="102" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">⚡ GitOps &amp; Continuous Delivery</text>
    </g>

    <!-- Pill 2: Self-Hosted Runners -->
    <g class="pill-animated-2" transform="translate(-235, 0)">
      <rect x="0" y="0" width="215" height="42" rx="21" fill="#0f172a" fill-opacity="0.9" stroke="#818cf8" stroke-width="1.2" />
      <text x="107" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">🛠️ Self-Hosted Runner Infrastructure</text>
    </g>

    <!-- Pill 3: Managed SaaS -->
    <g class="pill-animated-3" transform="translate(0, 0)">
      <rect x="0" y="0" width="215" height="42" rx="21" fill="#0f172a" fill-opacity="0.9" stroke="#c084fc" stroke-width="1.2" />
      <text x="107" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">☁️ Managed Enterprise SaaS</text>
    </g>

    <!-- Pill 4: Container Builds -->
    <g class="pill-animated-4" transform="translate(235, 0)">
      <rect x="0" y="0" width="225" height="42" rx="21" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
      <text x="112" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">📦 Container-Native Pipelines</text>
    </g>
  </g>

  <!-- Banner Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="14" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />
</svg>
